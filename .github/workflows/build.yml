name: Build exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install keyboard pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name ButtonPanel button_panel.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ButtonPanel
          path: dist/ButtonPanel.exe
